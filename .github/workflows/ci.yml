# The gates every pull request has to pass.
#
# A maintainer runs the same checks locally:
#   composer install --working-dir=tools
#   composer lint
#   composer analyze
#   composer test-cs
#
# The suite parses the JavaScript the embeds emit and runs the watch it emits
# against stubbed engines rather than matching either piece by piece, so it
# needs node on the PATH. The phpunit job installs it rather than taking it
# from whatever the runner image happens to carry, and a run without it
# reports the test as failed.
name: CI

on:
  pull_request:
    branches:
      - 4.x
  push:
    branches:
      - 4.x

permissions:
  contents: read

jobs:
  phplint:
    name: phplint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the library
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install the tools
        run: composer install --working-dir=tools --no-interaction --no-progress

      - name: Lint every PHP file
        run: tools/vendor/bin/phplint ./ --exclude=vendor --exclude=tools/vendor --warning

  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the library
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install the tools
        run: composer install --working-dir=tools --no-interaction --no-progress

      - name: Analyse the hand-written tree
        run: tools/vendor/bin/phpstan analyse -c tools/phpstan.neon src --no-progress --memory-limit=1G

  php-cs-fixer:
    name: php-cs-fixer
    runs-on: ubuntu-latest
    steps:
      - name: Check out the library
        uses: actions/checkout@v4

      # Without an unbounded memory limit the fixer runs out of memory on the
      # generated client, and under a default limit it reports success while
      # having skipped the file.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          ini-values: memory_limit=-1

      - name: Install the tools
        run: composer install --working-dir=tools --no-interaction --no-progress

      # The fixer re-analyses only the files whose content or rules changed, and
      # analysing the generated client takes minutes, so the cache is what keeps
      # this job short after its first run.
      - name: Restore the style cache
        uses: actions/cache@v4
        with:
          path: .php-cs-fixer.cache
          key: php-cs-fixer-${{ hashFiles('tools/composer.lock', 'tools/.php-cs-fixer.php') }}-${{ github.sha }}
          restore-keys: php-cs-fixer-${{ hashFiles('tools/composer.lock', 'tools/.php-cs-fixer.php') }}-

      # The configuration sizes its worker pool from the host's cores, and a
      # worker exceeds its 120 second timeout on the generated client, which
      # is one file of 67,000 lines. --sequential keeps the run on one process.
      - name: Check the code style
        run: tools/vendor/bin/php-cs-fixer fix --dry-run --diff --sequential --config=tools/.php-cs-fixer.php

  phpunit:
    name: phpunit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the library
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # The suite hands the JavaScript the embeds emit to node, so the major
      # line it runs under is named here rather than left to the runner image.
      # Which 22.x answers is the runner's own to resolve and nothing in the
      # suite asks for more than the line, the way the PHP version above names
      # 8.3 and leaves the release of that line to the runner as well.
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the library
        run: composer install --no-interaction --no-progress

      - name: Install the tools
        run: composer install --working-dir=tools --no-interaction --no-progress

      - name: Run the test suite
        run: tools/vendor/bin/phpunit
