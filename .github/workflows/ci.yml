# The gates every pull request has to pass.
#
# A maintainer runs the same checks locally:
#   composer install --working-dir=tools
#   composer lint
#   composer analyze
#   composer test-cs
name: CI

on:
  pull_request:
    branches:
      - 4.x
  push:
    branches:
      - 4.x

permissions:
  contents: read

jobs:
  phplint:
    name: phplint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the library
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install the tools
        run: composer install --working-dir=tools --no-interaction --no-progress

      - name: Lint every PHP file
        run: tools/vendor/bin/phplint ./ --exclude=vendor --exclude=tools/vendor --warning

  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the library
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install the tools
        run: composer install --working-dir=tools --no-interaction --no-progress

      - name: Analyse the hand-written tree
        run: tools/vendor/bin/phpstan analyse -c tools/phpstan.neon src --no-progress --memory-limit=1G

  php-cs-fixer:
    name: php-cs-fixer
    runs-on: ubuntu-latest
    steps:
      - name: Check out the library
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install the tools
        run: composer install --working-dir=tools --no-interaction --no-progress

      - name: Check the code style
        run: tools/vendor/bin/php-cs-fixer fix --dry-run --diff --config=tools/.php-cs-fixer.php

  phpunit:
    name: phpunit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the library
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Run the test suite
        run: |
          set -e
          if [ ! -f phpunit.xml.dist ]; then
            echo "The test lane has no tests yet: phpunit.xml.dist does not exist." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          composer install --no-interaction --no-progress
          vendor/bin/phpunit
