# Regenerates src/V2/Raw from the Sync Core OpenAPI document, runs
# tools/apply-generator-corrections.php to re-apply the client corrections,
# formats the result and commits it to the branch the run was dispatched on.
#
# Where the document is read from is this repository's configuration and not
# text in this file: the secrets OPENAPI_DOCUMENT_REPOSITORY,
# OPENAPI_DOCUMENT_REF and OPENAPI_DOCUMENT_PATH say where to read it and
# SYNC_CORE_READ_TOKEN authorizes that read. They are secrets and not variables,
# and the ref is one of them rather than a dispatch input, because this
# repository is public and so is everything a run of it records: a secret is
# redacted, a variable and an input are printed as they were given. Generating
# from a different ref means changing OPENAPI_DOCUMENT_REF. No other workflow
# here uses any of them.
#
# Dispatch:
#   gh workflow run regenerate-client.yml --ref <branch>
#   gh workflow run regenerate-client.yml --ref <branch> -f assert_empty=true
#
# With assert_empty the run commits nothing and fails when the generation
# differs from what is committed, which is how a drift check is run.
name: Regenerate the client

on:
  workflow_dispatch:
    inputs:
      assert_empty:
        description: Fail when the generation differs from the committed client instead of committing it.
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  regenerate:
    name: regenerate
    runs-on: ubuntu-latest
    steps:
      - name: Check the document source is configured
        env:
          DOCUMENT_REPOSITORY: ${{ secrets.OPENAPI_DOCUMENT_REPOSITORY }}
          DOCUMENT_REF: ${{ secrets.OPENAPI_DOCUMENT_REF }}
          DOCUMENT_PATH: ${{ secrets.OPENAPI_DOCUMENT_PATH }}
          DOCUMENT_TOKEN: ${{ secrets.SYNC_CORE_READ_TOKEN }}
        run: |
          set -e
          missing=
          [ -n "$DOCUMENT_REPOSITORY" ] || missing="$missing OPENAPI_DOCUMENT_REPOSITORY"
          [ -n "$DOCUMENT_REF" ] || missing="$missing OPENAPI_DOCUMENT_REF"
          [ -n "$DOCUMENT_PATH" ] || missing="$missing OPENAPI_DOCUMENT_PATH"
          [ -n "$DOCUMENT_TOKEN" ] || missing="$missing SYNC_CORE_READ_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::this run has no document to generate from; set the repository secrets:$missing"
            exit 1
          fi

      - name: Check out the library
        uses: actions/checkout@v4
        with:
          path: library

      # One document, read through the contents API rather than checked out:
      # nothing but the document itself reaches this public repository's runner,
      # and no step prints where it came from. Anything the request does not
      # answer with the document is reported by its status code, and the answer
      # has to be a YAML OpenAPI 3 document before the generator ever sees it -
      # a path that names a directory answers 200 with a listing.
      - name: Read the OpenAPI document
        env:
          DOCUMENT_REPOSITORY: ${{ secrets.OPENAPI_DOCUMENT_REPOSITORY }}
          DOCUMENT_REF: ${{ secrets.OPENAPI_DOCUMENT_REF }}
          DOCUMENT_PATH: ${{ secrets.OPENAPI_DOCUMENT_PATH }}
          DOCUMENT_TOKEN: ${{ secrets.SYNC_CORE_READ_TOKEN }}
        run: |
          set -e
          mkdir -p generated
          status=$(curl --silent --get --max-time 120 \
            --output generated/openapi.yaml --write-out '%{http_code}' \
            --header "Authorization: Bearer $DOCUMENT_TOKEN" \
            --header "Accept: application/vnd.github.raw" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-urlencode "ref=$DOCUMENT_REF" \
            "https://api.github.com/repos/$DOCUMENT_REPOSITORY/contents/$DOCUMENT_PATH" 2>/dev/null) || status=000
          if [ "$status" != "200" ]; then
            rm -f generated/openapi.yaml
            echo "::error::the OpenAPI document could not be read (HTTP $status); check the document secrets and the read token"
            exit 1
          fi
          if ! grep -q '^openapi:' generated/openapi.yaml; then
            rm -f generated/openapi.yaml
            echo "::error::what the source answered is not a YAML OpenAPI 3 document; check the document secrets"
            exit 1
          fi
          echo "Read $(wc -c < generated/openapi.yaml) bytes of OpenAPI document."

      # Without an unbounded memory limit the fixer runs out of memory on the
      # generated client, and under a default limit it reports success while
      # having skipped the file.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          ini-values: memory_limit=-1

      - name: Install the tools
        working-directory: library
        run: composer install --working-dir=tools --no-interaction --no-progress

      - name: Generate the client
        run: |
          set -e
          docker run --rm -v "$PWD/generated:/local" openapitools/openapi-generator-cli:v6.4.0 generate \
            -i /local/openapi.yaml \
            -g php \
            -o /local/dist \
            --additional-properties=invokerPackage=EdgeBox\\SyncCore\\V2\\Raw \
            --additional-properties=variableNamingConvention=camelCase
          sudo chown -R "$(id -u):$(id -g)" generated

      - name: Copy the generation over the client
        run: cp -R generated/dist/lib/. library/src/V2/Raw/

      - name: Apply the generator corrections
        working-directory: library
        run: php tools/apply-generator-corrections.php src/V2/Raw

      # --sequential keeps the run on one process: the configuration sizes its
      # worker pool from the host's cores, and a worker exceeds its 120 second
      # timeout on the API class, which is one file of 67,000 lines. That file
      # also needs a second pass, because the fixer reaches its own per-file
      # iteration limit before it settles. The third run proves it settled.
      - name: Format the generated client
        working-directory: library
        run: |
          set -e
          tools/vendor/bin/php-cs-fixer fix --sequential --using-cache=no --config=tools/.php-cs-fixer.php src/V2/Raw
          tools/vendor/bin/php-cs-fixer fix --sequential --using-cache=no --config=tools/.php-cs-fixer.php src/V2/Raw
          if ! tools/vendor/bin/php-cs-fixer fix --dry-run --sequential --using-cache=no --config=tools/.php-cs-fixer.php src/V2/Raw; then
            echo "::error::the generated client does not settle under tools/.php-cs-fixer.php within two passes"
            exit 1
          fi

      - name: Report what the generation changed
        working-directory: library
        run: |
          set -e
          added=$(git status --porcelain --untracked-files=all -- src/V2/Raw | grep -c '^??' || true)
          changed=$(git status --porcelain --untracked-files=all -- src/V2/Raw | grep -c '^ M' || true)
          git ls-files src/V2/Raw | sed 's#^src/V2/Raw/##' | sort > "$RUNNER_TEMP/committed.txt"
          (cd ../generated/dist/lib && find . -type f | sed 's#^\./##' | sort) > "$RUNNER_TEMP/generated.txt"
          removed=$(comm -23 "$RUNNER_TEMP/committed.txt" "$RUNNER_TEMP/generated.txt" | wc -l | tr -d ' ')
          echo "ADDED=$added" >> "$GITHUB_ENV"
          echo "CHANGED=$changed" >> "$GITHUB_ENV"
          echo "REMOVED=$removed" >> "$GITHUB_ENV"
          {
            echo "Generated from the Sync Core OpenAPI document"
            echo ""
            echo "- added: $added"
            echo "- changed: $changed"
            echo "- no longer generated: $removed"
            echo ""
            echo "Files the generation no longer produces stay in place; the run deletes nothing."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail when the committed client is out of date
        if: ${{ inputs.assert_empty }}
        working-directory: library
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- src/V2/Raw)" ]; then
            echo "::error::the committed client does not match the OpenAPI document this run read"
            git status --porcelain --untracked-files=all -- src/V2/Raw
            exit 1
          fi
          echo "The committed client matches the OpenAPI document this run read."

      - name: Commit the regeneration
        if: ${{ !inputs.assert_empty }}
        working-directory: library
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          if [ -z "$(git status --porcelain --untracked-files=all -- src/V2/Raw)" ]; then
            echo "The committed client already matches the OpenAPI document this run read."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/V2/Raw
          git commit \
            -m "chore: regenerate the client from the Sync Core OpenAPI document" \
            -m "added: $ADDED, changed: $CHANGED, no longer generated: $REMOVED"
          git push origin "HEAD:$REF_NAME"
